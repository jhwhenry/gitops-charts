  ibm-licensing:
  - annotations:
      charts.openshift.io/name: ibm-licensing
      charts.openshift.io/provider: IBM
      charts.openshift.io/source-url: https://github.com/IBM/ibm-licensing-operator
      charts.openshift.io/sources: https://github.com/IBM/ibm-licensing-operator
    apiVersion: v2
    created: "2026-11-24T21:07:45.311338125-05:00"
    description: A Helm chart for License Service. Contains the namespace-scope resources.
      You can use License Service to retrieve license usage data from your cluster
      and create a licensing snapshot. License Service collects and measures the license
      usage of your IBM® products at the cluster level. You can retrieve this data
      upon request for monitoring and compliance. You can also retrieve an audit snapshot
      of the data that is audit evidence. License Service is required for monitoring
      and measuring license usage of the IBM Cloud Paks® and IBM® stand-alone containerized
      software in accord with the pricing rule for containerized environments. Manual
      license measurements are not allowed.
    digest: a362f6aaf0b8326fc02c90ff95689af52b2dfc4fac69be0f878207c59755983b
    home: https://ibm.biz/license-service
